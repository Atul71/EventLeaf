<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | EventLeaf</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee3b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102212",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .leaf-pattern-tl {
            position: fixed;
            top: -50px;
            left: -50px;
            opacity: 0.04;
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 0;
        }
        .leaf-pattern-br {
            position: fixed;
            bottom: -50px;
            right: -50px;
            opacity: 0.04;
            transform: rotate(165deg);
            pointer-events: none;
            z-index: 0;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Subtle Decorative Leaf Backgrounds -->
<div class="leaf-pattern-tl">
<svg class="text-primary" fill="currentColor" height="400" viewbox="0 0 24 24" width="400">
<path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"></path>
</svg>
</div>
<div class="leaf-pattern-br">
<svg class="text-primary" fill="currentColor" height="400" viewbox="0 0 24 24" width="400">
<path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8,20C19,20 22,3 22,3C21,5 14,5.25 9,6.25C4,7.25 2,11.5 2,13.5C2,15.5 3.75,17.25 3.75,17.25C7,8 17,8 17,8Z"></path>
</svg>
</div>
<!-- Navigation -->
<nav class="relative z-10 w-full px-6 lg:px-20 py-6 flex justify-between items-center bg-transparent">
<div class="flex items-center gap-2 group cursor-pointer">
<div class="bg-primary p-1.5 rounded-lg shadow-sm">
<span class="material-symbols-outlined text-white text-2xl font-bold">eco</span>
</div>
<span class="text-xl font-extrabold tracking-tight text-[#0d1b0f] dark:text-white">EventLeaf</span>
</div>
<div class="flex items-center gap-4">
<span class="text-sm text-[#4c9a52] dark:text-primary/80 hidden md:inline">Already a member?</span>
<button class="px-5 py-2 text-sm font-bold text-[#0d1b0f] dark:text-white border border-[#cfe7d1] dark:border-primary/20 rounded-lg hover:bg-[#e7f3e8] dark:hover:bg-primary/10 transition-colors">
                Log In
            </button>
</div>
</nav>
<!-- Main Content -->
<main class="flex-1 flex flex-col items-center justify-center px-6 py-12 relative z-10">
<div class="w-full max-w-[480px] bg-white dark:bg-[#1a2e1c] shadow-xl shadow-primary/5 rounded-2xl p-8 lg:p-10 border border-[#e7f3e8] dark:border-primary/10">
<!-- Form Header -->
<div class="mb-8 text-center md:text-left">
<h1 class="text-3xl font-black text-[#0d1b0f] dark:text-white leading-tight mb-2">Create Account</h1>
<p class="text-[#4c9a52] dark:text-primary/70 text-sm">Join the eco-friendly event management movement today.</p>
</div>
<!-- Role Selector Toggle -->
<div class="mb-8">
<p class="text-sm font-semibold text-[#0d1b0f] dark:text-white mb-3">I want to join as an:</p>
<div class="flex p-1 bg-[#f0f7f1] dark:bg-[#0d1b0f] rounded-xl border border-[#cfe7d1] dark:border-primary/10">
<label class="flex-1 relative cursor-pointer group">
<input checked="" class="peer hidden" name="role" type="radio" value="attendee"/>
<div class="py-2.5 text-center rounded-lg text-sm font-bold transition-all peer-checked:bg-primary peer-checked:text-[#0d1b0f] text-[#4c9a52] group-hover:text-[#0d1b0f] dark:text-primary/60 dark:peer-checked:text-black">
                            Attendee
                        </div>
</label>
<label class="flex-1 relative cursor-pointer group">
<input class="peer hidden" name="role" type="radio" value="organizer"/>
<div class="py-2.5 text-center rounded-lg text-sm font-bold transition-all peer-checked:bg-primary peer-checked:text-[#0d1b0f] text-[#4c9a52] group-hover:text-[#0d1b0f] dark:text-primary/60 dark:peer-checked:text-black">
                            Organizer
                        </div>
</label>
</div>
</div>
<!-- Sign Up Form -->
<form action="#" class="space-y-5">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-[#4c9a52] dark:text-primary/60 px-1">Full Name</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#4c9a52] text-xl transition-colors group-focus-within:text-primary">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-[#f8fcf8] dark:bg-[#0d1b0f] border border-[#cfe7d1] dark:border-primary/20 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-[#0d1b0f] dark:text-white placeholder:text-[#4c9a52]/50 transition-all" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-[#4c9a52] dark:text-primary/60 px-1">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#4c9a52] text-xl transition-colors group-focus-within:text-primary">mail</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-[#f8fcf8] dark:bg-[#0d1b0f] border border-[#cfe7d1] dark:border-primary/20 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-[#0d1b0f] dark:text-white placeholder:text-[#4c9a52]/50 transition-all" placeholder="name@email.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-1.5">
<label class="text-xs font-bold uppercase tracking-wider text-[#4c9a52] dark:text-primary/60 px-1">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-[#4c9a52] text-xl transition-colors group-focus-within:text-primary">lock</span>
<input class="w-full pl-12 pr-12 py-3.5 bg-[#f8fcf8] dark:bg-[#0d1b0f] border border-[#cfe7d1] dark:border-primary/20 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none text-[#0d1b0f] dark:text-white placeholder:text-[#4c9a52]/50 transition-all" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-[#4c9a52] hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Terms & Conditions -->
<div class="flex items-start gap-3 py-2">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded border-[#cfe7d1] text-primary focus:ring-primary/30 cursor-pointer" id="terms" type="checkbox"/>
</div>
<label class="text-xs text-[#4c9a52] dark:text-primary/70 leading-relaxed cursor-pointer select-none" for="terms">
                        I agree to the <a class="font-bold text-[#0d1b0f] dark:text-white hover:underline underline-offset-2" href="#">Terms of Service</a> and 
                        <a class="font-bold text-[#0d1b0f] dark:text-white hover:underline underline-offset-2" href="#">Privacy Policy</a> regarding my personal data.
                    </label>
</div>
<!-- Create Account Button -->
<button class="w-full bg-primary hover:bg-[#25d633] text-[#0d1b0f] font-extrabold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98] flex items-center justify-center gap-2 group" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-lg transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</form>
<!-- Social Sign Up -->
<div class="mt-8">
<div class="relative flex items-center justify-center mb-6">
<div class="flex-grow border-t border-[#e7f3e8] dark:border-primary/10"></div>
<span class="flex-shrink mx-4 text-[10px] font-black uppercase tracking-widest text-[#4c9a52]/50">Or sign up with</span>
<div class="flex-grow border-t border-[#e7f3e8] dark:border-primary/10"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 border border-[#cfe7d1] dark:border-primary/10 rounded-xl bg-white dark:bg-transparent hover:bg-[#f8fcf8] dark:hover:bg-primary/5 transition-colors text-sm font-bold text-[#0d1b0f] dark:text-white">
<img alt="Google Logo" class="w-5 h-5" data-alt="Google logo icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBav1M_9QZ5IVpcYhAySup9lqtYtZh-JuZ2rGHVphQfTdTxsgwDoFK_xLNWOdNwnVNj7kUbneTcFMpGthLzoR6sPdWleD1qBsUVoepI3AA7a3VyN2GZtQbKCLEYCuTpmGUj0TEGvqKVDcsrCoYY-Anlv4Eo1YlcxkYh476DqbIjPKWOgTY8191WrZFUbp4aOhKHQyBIOAXyR9rhoOK2_jKNLVFuu7D14Qh9qoWfU6UhmTyeKY7XlNYNJzgHPTPIQDTzsjNgyb0mMg"/>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 py-3 border border-[#cfe7d1] dark:border-primary/10 rounded-xl bg-white dark:bg-transparent hover:bg-[#f8fcf8] dark:hover:bg-primary/5 transition-colors text-sm font-bold text-[#0d1b0f] dark:text-white">
<span class="material-symbols-outlined text-xl">ios</span>
                        Apple
                    </button>
</div>
</div>
</div>
<!-- Footer Text -->
<p class="mt-10 text-center text-[#4c9a52] dark:text-primary/50 text-xs">
            © 2024 EventLeaf Management Inc. <br class="md:hidden"/> Powered by 100% renewable energy workflows.
        </p>
</main>
</body></html>
