name: eventleaf

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventleaf-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      APP_PORT: ${APP_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-eventleaf_db}
      DB_USER: ${DB_USER:-eventleaf_user}
      DB_PASSWORD: ${DB_PASSWORD:-eventleaf_password}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-eventleaf_session}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-America/New_York}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventleaf-network

  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: eventleaf-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER:-eventleaf_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventleaf_password}
      POSTGRES_DB: ${DB_NAME:-eventleaf_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Mount schema initialization script
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      # Mount seed data script if it exists
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventleaf_user} -d ${DB_NAME:-eventleaf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventleaf-network

  # pgAdmin for database management (optional but useful)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: eventleaf-pgadmin
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@eventleaf.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eventleaf-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  eventleaf-network:
    driver: bridge
